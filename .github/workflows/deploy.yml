name: Deploy

# Push to main deploys the Worker, but only if the suite passes first.
# Docs-only pushes are skipped (paths-ignore applies when every changed file matches).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy that is already in flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11. npm 10 has an arborist bug that crashes resolving
      # Vitest 4's peer graph, so do not drop below this.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # build.mjs runs via pretest, and again via wrangler's [build] command.
      - name: Test
        run: npm test

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
